<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>SuperGrow</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
</head>
<body>
  <div id="app">
    <div id="login-screen" class="centered">
      <h1>SuperGrow</h1>
      <button id="googleSignIn">Sign in with Google</button>
    </div>

    <div id="dashboard" style="display:none">
      <header>
        <button id="signOut">Sign out</button>
      </header>
      <main class="split">
        <section id="left">
          <div id="liveEmbed"></div>
          <h3>Recent uploads</h3>
          <ul id="videoList"></ul>
        </section>
        <aside id="right">
          <nav>
            <button data-action="temp1">TempMail Generator V1</button>
            <button data-action="temp2">TempMail Generator V2</button>
            <button data-action="supergrow">SuperGrow</button>
            <button data-action="telegram">Telegram</button>
            <button data-action="website">Website</button>
          </nav>
          <div id="panel"></div>
        </aside>
      </main>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
