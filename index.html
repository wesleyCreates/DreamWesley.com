<!doctype html>

<head>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <meta charset="utf-8" />
  <title>SuperGrow</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<body>
  <div id="app">
    <!-- Login screen -->
    <div id="login-screen" class="centered card">
      <h1>SuperGrow</h1>
      <p class="muted">Sign in with Google to continue</p>
      <button id="googleSignIn" class="btn primary">Sign in with Google</button>
      <p class="small muted">Only authenticated users can access the dashboard.</p>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" style="display:none">
      <header class="topbar">
        <div class="brand">SuperGrow</div>
        <div class="actions">
          <div id="notifWrap" style="position:relative">
            <button id="notifBtn" class="btn ghost" aria-label="Notifications">🔔
              <span id="notifBadge" class="notifBadge" style="display:none">0</span>
            </button>
          </div>
          <span id="signedInText" class="muted">Signed in</span>
          <button id="signOut" class="btn ghost">Sign out</button>
        </div>
      </header>

      <main class="split">
        <section id="left" class="panel">
          <div class="liveWrap card">
            <div id="channelHeader" class="channelHeader"></div>
            <div id="liveEmbed" class="embed"></div>
          </div>

          <div class="uploads card">
            <h3>Recent uploads</h3>
            <ul id="videoList" class="videoList"></ul>
          </div>
        </section>

        <aside id="right" class="panel">
          <nav class="nav card">
            <button data-action="temp1" class="navBtn">TempMail Generator V1</button>
            <button data-action="temp2" class="navBtn">TempMail Generator V2</button>
            <button data-action="supergrow" class="navBtn">SuperGrow</button>
            <button data-action="supergrow-status" class="navBtn">SuperGrow Status</button>
            <button data-action="telegram" class="navBtn">Telegram</button>
            <button data-action="website" class="navBtn">Website</button>
          </nav>

          <div id="panel" class="card panelContent">
            <h3>Welcome</h3>
            <p class="muted">Choose an option to continue.</p>
          </div>
        </aside>
      </main>
    </div>
  </div>
